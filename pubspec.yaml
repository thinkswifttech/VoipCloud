name: phone_app
description: "ThinkSwift VoipCloud softphone app."
publish_to: "none"
version: 1.0.0+23

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.2
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  forui: ^0.21.1
  go_router: ^17.2.1
  xml: ^7.0.1
  mobile_scanner: ^7.2.0
  lucide_icons_flutter: ^3.1.14+2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  package_info_plus: ^10.2.1
  flutter_contacts: ^2.1.0
  phone_numbers_parser: ^9.0.24
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  image: ^4.9.2
  desktop_drop: ^0.8.3
  file_selector: ^1.1.0
  zxing2: ^0.2.4
  connectivity_plus: ^6.1.5
  cryptography: ^2.9.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/directory/
  fonts:
    - family: Raleway
      fonts:
        - asset: assets/fonts/raleway/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/raleway/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/raleway/Raleway-SemiBold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/open_sans/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/open_sans/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/open_sans/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/open_sans/OpenSans-Bold.ttf
          weight: 700
